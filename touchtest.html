<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Érintésteszt — BMC LED fal</title>
<style>
  /* Diagnosztika a kijelzőhöz: mit küld a böngészőnek az érintőkeret (pointer / touch / egér események, ujjak száma) */
  html,body{margin:0;height:100%;background:#0a0806;color:#fff;font:22px/1.4 system-ui,sans-serif;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none}
  #info{position:absolute;left:24px;top:20px;right:24px;pointer-events:none;white-space:pre-wrap}
  #info b{color:#fcc542}
  .dot{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid #86bc25;
    pointer-events:none;display:grid;place-items:center;font-weight:700;color:#86bc25}
  #hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#a8a296}
</style>
</head>
<body>
<div id="info"></div>
<div id="hint">Érintsd meg, húzd, csippentsd két ujjal a képernyőt · görgess egérrel</div>
<script>
(function () {
  const info = document.getElementById('info'), dots = {};
  const n = { pointerdown: 0, pointermove: 0, pointerup: 0, pointercancel: 0, touchstart: 0, touchmove: 0, touchend: 0,
    mousedown: 0, mousemove: 0, mouseup: 0, wheel: 0, click: 0 };
  let types = {}, maxPointers = 0, maxTouches = 0, active = new Set(), lastEvt = '';
  function draw() {
    info.innerHTML =
      '<b>Böngésző:</b> ' + navigator.userAgent + '\n' +
      '<b>PointerEvent támogatás:</b> ' + ('PointerEvent' in window) + '   <b>TouchEvent:</b> ' + ('ontouchstart' in window) +
      '   <b>navigator.maxTouchPoints:</b> ' + navigator.maxTouchPoints + '\n' +
      '<b>Képernyő:</b> ' + screen.width + '×' + screen.height + ' @' + devicePixelRatio + 'x   <b>ablak:</b> ' + innerWidth + '×' + innerHeight + '\n\n' +
      '<b>Pointer típusok:</b> ' + (Object.keys(types).join(', ') || '—') +
      '   <b>egyszerre aktív pointerek (max):</b> ' + maxPointers + '   <b>egyszerre érintések (max):</b> ' + maxTouches + '\n' +
      Object.keys(n).map(k => k + ': ' + n[k]).join('   ') + '\n\n<b>Utolsó esemény:</b> ' + lastEvt;
  }
  Object.keys(n).forEach(t => window.addEventListener(t, e => {
    n[t]++;
    if (e.pointerType) types[e.pointerType] = (types[e.pointerType] || 0) + 1;
    if (e.touches) maxTouches = Math.max(maxTouches, e.touches.length);
    if (t === 'pointerdown') active.add(e.pointerId);
    if (t === 'pointerup' || t === 'pointercancel') active.delete(e.pointerId);
    maxPointers = Math.max(maxPointers, active.size);
    if (e.pointerId != null && t.startsWith('pointer')) {
      let d = dots[e.pointerId];
      if (!d && t !== 'pointerup' && t !== 'pointercancel') { d = dots[e.pointerId] = document.createElement('div'); d.className = 'dot'; d.textContent = e.pointerId; document.body.appendChild(d); }
      if (d) { d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px'; }
      if ((t === 'pointerup' || t === 'pointercancel') && d) { d.remove(); delete dots[e.pointerId]; }
    }
    lastEvt = t + (e.pointerType ? ' (' + e.pointerType + ', id ' + e.pointerId + ')' : '') + ' @ ' + Math.round(e.clientX || 0) + ',' + Math.round(e.clientY || 0);
    if (t === 'touchmove' || t === 'wheel') e.preventDefault();
    draw();
  }, { passive: false }));
  draw();
})();
</script>
</body>
</html>
